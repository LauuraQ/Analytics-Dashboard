<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Leads Analytics Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #060607;
            --bg-card: #121214;
            --bg-input: #1a1a1c;
            --border-color: #2d2d30;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #ffffff;
            --accent-hover: #e2e2e2;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .title {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--text-muted);
            background-color: #222224;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Вкладки доменов */
        .tabs-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .domain-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-add-tab {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* Раскладка дашборда */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .menu-item.active {
            background: #222226;
            border-color: var(--accent);
            color: var(--accent);
        }

        .menu-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--border-color);
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            height: 540px;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">
            <div>
                <h1>Отчетность проектов</h1>
                <div class="subtitle">Анализ динамики позиций, лидов и индексации</div>
            </div>
        </div>

        <!-- Ввод ссылки -->
        <div class="card">
            <div class="input-row">
                <input type="text" id="sheetUrl" style="flex: 1; min-width: 300px;"
                    placeholder="Ссылка на Google Таблицу"
                    value="https://docs.google.com/spreadsheets/d/1QUidv9CoxZRpAwpM8AYEfD9ShWR1hEs9sjLmSQi7k_8/edit" />
                <button class="btn btn-primary" id="loadBtn" onclick="initDashboard()">Загрузить отчет</button>
            </div>
            <div id="statusText" class="status-msg">
                Введите ссылку и нажмите кнопку «Загрузить отчет».
            </div>
        </div>

        <!-- Вкладки сайтов и кнопка добавления -->
        <div class="tabs-wrapper" id="tabsWrapper" style="display: none;">
            <div class="domain-tabs" id="domainTabs"></div>
            <button class="btn btn-add-tab" onclick="promptAddDomain()">+ Добавить сайт</button>
        </div>

        <!-- Область дашборда -->
        <div class="dashboard-layout" id="dashboardLayout" style="display: none;">

            <!-- Сайдбар категорий -->
            <div class="card">
                <div class="card-title">Разделы отчета</div>
                <div class="sidebar-menu">
                    <div class="menu-item active" data-category="subdomains" onclick="selectCategory('subdomains')">
                        <span>Поддомены Я + Г</span>
                        <span class="menu-badge" id="badge-subdomains">0</span>
                    </div>
                    <div class="menu-item" data-category="leads" onclick="selectCategory('leads')">
                        <span>Количество лидов</span>
                        <span class="menu-badge" id="badge-leads">0</span>
                    </div>
                    <div class="menu-item" data-category="topvisor" onclick="selectCategory('topvisor')">
                        <span>Топвизор</span>
                        <span class="menu-badge" id="badge-topvisor">0</span>
                    </div>
                    <div class="menu-item" data-category="metrika" onclick="selectCategory('metrika')">
                        <span>Яндекс Метрика</span>
                        <span class="menu-badge" id="badge-metrika">0</span>
                    </div>
                    <div class="menu-item" data-category="webmaster" onclick="selectCategory('webmaster')">
                        <span>Яндекс Вебмастер</span>
                        <span class="menu-badge" id="badge-webmaster">0</span>
                    </div>
                    <div class="menu-item" data-category="gsc" onclick="selectCategory('gsc')">
                        <span>Google Search Console</span>
                        <span class="menu-badge" id="badge-gsc">0</span>
                    </div>
                </div>
            </div>

            <!-- График -->
            <div class="card">
                <div class="card-title">
                    <span id="chartHeading">Поддомены: Яндекс vs Google</span>
                    <span class="subtitle" id="currentDomainLabel"></span>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentSpreadsheetId = "";
        let activeCategory = "subdomains";
        let chartInstance = null;
        let currentParsedData = null;
        let knownSheets = [];

        const DOMAIN_REGEX = /\.[a-zа-я0-9-]{2,}$/i;

        function extractSpreadsheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        function extractGid(url) {
            const match = url.match(/[#&]gid=([0-9]+)/);
            return match ? match[1] : null;
        }

        /**
         * Запрос через JSONP: браузер не применяет CORS-проверку к тегу <script>,
         * поэтому запрос не блокируется на GitHub Pages.
         */
        function fetchAllOriginsJSONP(url) {
            return new Promise((resolve, reject) => {
                const cbName = 'allorigins_cb_' + Math.round(Math.random() * 1000000);
                const script = document.createElement('script');

                const timeout = setTimeout(() => {
                    cleanup();
                    reject(new Error("Таймаут прокси"));
                }, 6000);

                function cleanup() {
                    clearTimeout(timeout);
                    delete window[cbName];
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cbName] = (data) => {
                    cleanup();
                    resolve(data.contents);
                };

                script.src = `https://api.allorigins.win/get?url=${encodeURIComponent(url)}&callback=${cbName}`;
                script.onerror = () => {
                    cleanup();
                    reject(new Error("Ошибка загрузки скрипта JSONP"));
                };
                document.body.appendChild(script);
            });
        }

        // Авто-поиск листов через JSONP
        async function discoverSheets(sheetId) {
            const targetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`;
            const html = await fetchAllOriginsJSONP(targetUrl);
            if (!html || typeof html !== "string") throw new Error("Пустой HTML");

            const doc = new DOMParser().parseFromString(html, "text/html");
            let names = [];
            doc.querySelectorAll(".sheet-tab, ul#sheet-menu li a, #sheet-menu li").forEach(el => {
                const t = el.textContent.trim();
                if (t) names.push(t);
            });

            if (names.length === 0) {
                const matches = [...html.matchAll(/name:\s*"([^"]+)"/g)].map(m => m[1]);
                names = [...new Set(matches)];
            }

            const domainSheets = names.filter(name => DOMAIN_REGEX.test(name));
            return domainSheets.length > 0 ? domainSheets : names;
        }

        async function initDashboard() {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            const status = document.getElementById("statusText");
            const loadBtn = document.getElementById("loadBtn");

            const sheetId = extractSpreadsheetId(urlInput);
            if (!sheetId) {
                status.innerText = "Ошибка: не удалось распознать ID Google Таблицы.";
                status.style.color = "var(--danger)";
                return;
            }

            currentSpreadsheetId = sheetId;
            const explicitGid = extractGid(urlInput);

            status.innerText = "Подключение к таблице...";
            status.style.color = "var(--text-muted)";
            loadBtn.disabled = true;

            // 1. Проверяем сохраненные ранее сайты в браузере для этой таблицы
            const saved = localStorage.getItem("sheets_" + sheetId);
            if (saved) {
                try { knownSheets = JSON.parse(saved); } catch (e) { knownSheets = []; }
            }

            // 2. Пробуем автодетект через JSONP
            try {
                const detected = await discoverSheets(sheetId);
                if (detected && detected.length > 0) {
                    // Объединяем с сохраненными
                    knownSheets = [...new Set([...knownSheets, ...detected])];
                    localStorage.setItem("sheets_" + sheetId, JSON.stringify(knownSheets));
                }
            } catch (err) {
                console.warn("Автодетект через прокси не ответил, используем локальные/прямые данные", err);
            }

            // 3. Если листы так и не известны:
            if (knownSheets.length === 0) {
                // Если в ссылке был gid=..., создаем ярлык по gid, иначе — "Основной лист"
                knownSheets = explicitGid ? [`gid=${explicitGid}`] : ["Основной отчет"];
            }

            renderDomainTabs(knownSheets);
            status.innerText = `Подключено. Открыт сайт: ${knownSheets[0]}`;
            status.style.color = "var(--success)";
            loadBtn.disabled = false;
        }

        function renderDomainTabs(sheets) {
            const wrapper = document.getElementById("tabsWrapper");
            const container = document.getElementById("domainTabs");
            container.innerHTML = "";
            wrapper.style.display = "flex";

            sheets.forEach((sheet, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = sheet;
                btn.onclick = () => {
                    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    loadSheet(sheet);
                };
                container.appendChild(btn);
            });

            document.getElementById("dashboardLayout").style.display = "grid";
            loadSheet(sheets[0]);
        }

        function promptAddDomain() {
            const name = prompt("Введите имя листа Google Таблицы (например, site.ru):");
            if (!name || !name.trim()) return;
            const cleanName = name.trim();
            if (!knownSheets.includes(cleanName)) {
                knownSheets.push(cleanName);
                localStorage.setItem("sheets_" + currentSpreadsheetId, JSON.stringify(knownSheets));
                renderDomainTabs(knownSheets);
            }
        }

        // Загрузка данных таблицы (нативный fetch с Google GViz API)
        async function loadSheet(sheetIdentifier) {
            document.getElementById("currentDomainLabel").innerText = sheetIdentifier;
            const status = document.getElementById("statusText");
            status.innerText = `Загрузка данных для "${sheetIdentifier}"...`;
            status.style.color = "var(--text-muted)";

            try {
                let gvizUrl = `https://docs.google.com/spreadsheets/d/${currentSpreadsheetId}/gviz/tq?tqx=out:json`;

                if (sheetIdentifier.startsWith("gid=")) {
                    gvizUrl += `&${sheetIdentifier}`;
                } else if (sheetIdentifier !== "Основной отчет") {
                    gvizUrl += `&sheet=${encodeURIComponent(sheetIdentifier)}`;
                }
                // Если "Основной отчет", параметр &sheet не передаем — Google сам отдает первый лист книги!

                const res = await fetch(gvizUrl);
                const raw = await res.text();

                const jsonStart = raw.indexOf("{");
                const jsonEnd = raw.lastIndexOf("}");
                if (jsonStart === -1 || jsonEnd === -1) {
                    throw new Error("Неверный формат ответа от Google Sheets");
                }

                const json = JSON.parse(raw.substring(jsonStart, jsonEnd + 1));
                if (!json || !json.table) throw new Error("Таблица пуста");

                processSheetData(json.table);
                updateCategoryBadges();
                renderCurrentChart();

                status.innerText = `Сайт "${sheetIdentifier}" успешно загружен.`;
                status.style.color = "var(--success)";
            } catch (e) {
                console.error(e);
                status.innerText = `Не удалось загрузить данные листа "${sheetIdentifier}". Проверьте точное имя вкладки.`;
                status.style.color = "var(--danger)";
            }
        }

        function cleanNumeric(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;

            let s = String(val).trim();
            if (!s || s === "-" || s.toLowerCase().includes("нет")) return 0;

            s = s.replace("%", "").trim().replace(",", ".");

            if (s.includes(":") && !s.includes(" ")) {
                const p = s.split(":");
                return p.length === 2 ? parseFloat(p[0]) * 60 + parseFloat(p[1]) : parseFloat(p[0]) || 0;
            }
            if (s.includes("м") || s.includes("c")) {
                const m = s.match(/(\d+)\s*м/);
                const sec = s.match(/(\d+)\s*c/);
                return (m ? parseInt(m[1]) : 0) * 60 + (sec ? parseInt(sec[1]) : 0);
            }

            const num = parseFloat(s);
            return isNaN(num) ? 0 : num;
        }

        /**
         * Динамический парсер колонок и данных
         */
        function processSheetData(table) {
            const matrix = [];
            table.rows.forEach(r => {
                const row = [];
                (r.c || []).forEach(cell => {
                    let v = "";
                    if (cell) {
                        v = cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : "");
                    }
                    row.push(v);
                });
                matrix.push(row);
            });

            if (matrix.length < 2) return;

            // 1. Поиск строки с датами (первая строка вида "06.04.26 - 12.04.26")
            let dataStartRow = -1;
            for (let r = 0; r < matrix.length; r++) {
                const firstCell = String(matrix[r][0] || "").trim();
                if (/\d{1,2}\.\d{1,2}/.test(firstCell)) {
                    dataStartRow = r;
                    break;
                }
            }
            if (dataStartRow === -1) dataStartRow = 3;

            // 2. Поиск строки с главными разделами отчета
            let catRowIdx = 0;
            let maxMatches = -1;

            for (let r = 0; r < dataStartRow; r++) {
                const rowStr = matrix[r].join(" ").toLowerCase();
                let matches = 0;
                if (rowStr.includes("лид")) matches++;
                if (rowStr.includes("топвизор")) matches++;
                if (rowStr.includes("метрика")) matches++;
                if (rowStr.includes("вебмастер")) matches++;
                if (rowStr.includes("search") || rowStr.includes("gsc")) matches++;
                if (rowStr.includes("поддомен")) matches++;

                if (matches > maxMatches) {
                    maxMatches = matches;
                    catRowIdx = r;
                }
            }

            const catRow = matrix[catRowIdx] || [];
            const columns = [];
            let activeCatKey = null;

            let maxCols = 0;
            matrix.forEach(row => { if (row.length > maxCols) maxCols = row.length; });

            // 3. Forward-fill разделов и привязка метрик
            for (let c = 1; c < maxCols; c++) {
                const topCell = String(catRow[c] || "").trim().toLowerCase();

                if (topCell.includes("лид")) activeCatKey = "leads";
                else if (topCell.includes("топвизор")) activeCatKey = "topvisor";
                else if (topCell.includes("метрика")) activeCatKey = "metrika";
                else if (topCell.includes("вебмастер")) activeCatKey = "webmaster";
                else if (topCell.includes("google search") || topCell.includes("gsc") || topCell.includes("search console")) activeCatKey = "gsc";
                else if (topCell.includes("поддомены я") || topCell.includes("поддомен я")) activeCatKey = "subdomains_ya";
                else if (topCell.includes("поддомены г") || topCell.includes("поддомен г") || topCell.includes("поддомены g")) activeCatKey = "subdomains_google";
                else if (topCell.includes("расход") || topCell.includes("работ")) activeCatKey = null;

                if (!activeCatKey) continue;

                let metricName = "";
                for (let r = dataStartRow - 1; r > catRowIdx; r--) {
                    const val = String(matrix[r][c] || "").replace(/\n/g, " ").trim();
                    if (val) {
                        metricName = val;
                        break;
                    }
                }

                if (!metricName) {
                    if (activeCatKey === "leads") metricName = "Лиды";
                    else if (activeCatKey === "subdomains_ya") metricName = "Поддомены Я";
                    else if (activeCatKey === "subdomains_google") metricName = "Поддомены Г";
                    else metricName = `Метрика ${c}`;
                }

                columns.push({
                    index: c,
                    category: activeCatKey,
                    metric: metricName
                });
            }

            // 4. Сбор значений по датам
            const dates = [];
            const store = {
                leads: {}, topvisor: {}, metrika: {}, webmaster: {},
                gsc: {}, subdomains_ya: {}, subdomains_google: {}
            };

            for (let r = dataStartRow; r < matrix.length; r++) {
                const period = String(matrix[r][0] || "").trim();
                if (!period || !/\d{1,2}\.\d{1,2}/.test(period)) continue;
                dates.push(period);

                columns.forEach(col => {
                    if (!store[col.category][col.metric]) {
                        store[col.category][col.metric] = [];
                    }
                    const rawVal = matrix[r][col.index];
                    store[col.category][col.metric].push(cleanNumeric(rawVal));
                });
            }

            currentParsedData = { dates, store, columns };
        }

        function updateCategoryBadges() {
            if (!currentParsedData) return;
            const s = currentParsedData.store;

            const subCount = Object.keys(s.subdomains_ya || {}).length + Object.keys(s.subdomains_google || {}).length;
            document.getElementById("badge-subdomains").innerText = subCount;
            document.getElementById("badge-leads").innerText = Object.keys(s.leads || {}).length;
            document.getElementById("badge-topvisor").innerText = Object.keys(s.topvisor || {}).length;
            document.getElementById("badge-metrika").innerText = Object.keys(s.metrika || {}).length;
            document.getElementById("badge-webmaster").innerText = Object.keys(s.webmaster || {}).length;
            document.getElementById("badge-gsc").innerText = Object.keys(s.gsc || {}).length;
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll(".menu-item").forEach(el => {
                el.classList.toggle("active", el.getAttribute("data-category") === cat);
            });
            renderCurrentChart();
        }

        function renderCurrentChart() {
            if (!currentParsedData) return;
            const ctx = document.getElementById("mainChart").getContext("2d");
            const { dates, store } = currentParsedData;
            let datasets = [];

            const colors = [
                "#3b82f6", "#10b981", "#f59e0b", "#ec4899",
                "#8b5cf6", "#06b6d4", "#f97316", "#14b8a6", "#e11d48"
            ];

            if (activeCategory === "subdomains") {
                document.getElementById("chartHeading").innerText = "Поддомены: Яндекс vs Google";

                // Яндекс
                Object.keys(store.subdomains_ya || {}).forEach(m => {
                    datasets.push({
                        label: `Яндекс (${m})`,
                        data: store.subdomains_ya[m],
                        borderColor: "#f59e0b",
                        backgroundColor: "rgba(245, 158, 11, 0.15)",
                        borderWidth: 2.5,
                        tension: 0.25
                    });
                });

                // Google
                Object.keys(store.subdomains_google || {}).forEach(m => {
                    datasets.push({
                        label: `Google (${m})`,
                        data: store.subdomains_google[m],
                        borderColor: "#3b82f6",
                        borderDash: [6, 4],
                        backgroundColor: "rgba(59, 130, 246, 0.15)",
                        borderWidth: 2.5,
                        tension: 0.25
                    });
                });

            } else {
                const target = store[activeCategory] || {};
                let cIdx = 0;

                Object.keys(target).forEach(m => {
                    const vals = target[m];
                    const col = colors[cIdx % colors.length];

                    datasets.push({
                        label: m,
                        data: vals,
                        borderColor: col,
                        backgroundColor: col + "20",
                        borderWidth: 2,
                        tension: 0.25
                    });
                    cIdx++;
                });

                const activeTitle = document.querySelector(`.menu-item[data-category="${activeCategory}"] span`);
                document.getElementById("chartHeading").innerText = activeTitle ? activeTitle.innerText : "График";
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: dates, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            labels: { color: '#e7e9ea', font: { size: 12 } }
                        },
                        tooltip: {
                            backgroundColor: '#121214',
                            titleColor: '#e7e9ea',
                            bodyColor: '#71767b',
                            borderColor: '#2d2d30',
                            borderWidth: 1,
                            padding: 10
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#2d2d30' },
                            ticks: { color: '#71767b', maxRotation: 45 }
                        },
                        y: {
                            grid: { color: '#2d2d30' },
                            ticks: { color: '#71767b' },
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        window.addEventListener("DOMContentLoaded", () => {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            if (urlInput) initDashboard();
        });
    </script>
</body>

</html>
