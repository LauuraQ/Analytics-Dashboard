<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Leads Analytics Dashboard</title>

    <!-- Подключение Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #060607;
            --bg-card: #121214;
            --bg-input: #1a1a1c;
            --border-color: #2d2d30;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #ffffff;
            --accent-hover: #e2e2e2;
            --danger: #f43f5e;
            --danger-hover: #e11d48;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 32px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .title {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Верхняя панель ввода */
        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 300px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--text-muted);
            background-color: #222224;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Навигация по сайтам (вкладки сверху) */
        .domain-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        /* Рабочая область: Меню + График */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .menu-item.active {
            background: #222226;
            border-color: var(--accent);
            color: var(--accent);
        }

        .menu-badge {
            font-size: 11px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--border-color);
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            height: 540px;
            width: 100%;
        }

        /* Скроллбары */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background-color: var(--bg-main);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background-color: var(--text-muted);
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">
            <div>
                <h1>Отчетность проектов</h1>
                <div class="subtitle">Автоматическая визуализация данных Google Таблиц</div>
            </div>
        </div>

        <!-- Блок ввода ссылки -->
        <div class="card">
            <div class="input-row">
                <input type="text" id="sheetUrl"
                    placeholder="Вставьте ссылку на Google Таблицу (доступ: «Все, у кого есть ссылка»)"
                    value="https://docs.google.com/spreadsheets/d/1QUidv9CoxZRpAwpM8AYEfD9ShWR1hEs9sjLmSQi7k_8/edit" />
                <button class="btn btn-primary" id="loadBtn" onclick="initDashboard()">Загрузить отчет</button>
            </div>
            <div id="statusText" class="status-msg">
                Готов к работе. Вставьте ссылку и нажмите «Загрузить отчет».
            </div>
        </div>

        <!-- Вкладки сайтов (.ru, .com и т.д.) -->
        <div class="domain-tabs" id="domainTabs" style="display: none;"></div>

        <!-- Основной рабочий блок -->
        <div class="dashboard-layout" id="dashboardLayout" style="display: none;">

            <!-- Сайдбар категорий -->
            <div class="card">
                <div class="card-title">Разделы отчета</div>
                <div class="sidebar-menu">
                    <div class="menu-item" data-category="leads" onclick="selectCategory('leads')">
                        <span>Количество лидов</span>
                    </div>
                    <div class="menu-item" data-category="topvisor" onclick="selectCategory('topvisor')">
                        <span>Топвизор</span>
                    </div>
                    <div class="menu-item" data-category="metrika" onclick="selectCategory('metrika')">
                        <span>Яндекс Метрика</span>
                    </div>
                    <div class="menu-item" data-category="webmaster" onclick="selectCategory('webmaster')">
                        <span>Яндекс Вебмастер</span>
                    </div>
                    <div class="menu-item" data-category="gsc" onclick="selectCategory('gsc')">
                        <span>Google Search Console</span>
                    </div>
                    <div class="menu-item active" data-category="subdomains" onclick="selectCategory('subdomains')">
                        <span>Поддомены Я + Г</span>
                        <span class="menu-badge">Наложение</span>
                    </div>
                </div>
            </div>

            <!-- График -->
            <div class="card">
                <div class="card-title">
                    <span id="chartHeading">Поддомены: Яндекс vs Google</span>
                    <span class="subtitle" id="currentDomainLabel"></span>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentSpreadsheetId = "";
        let activeSheetName = "";
        let activeCategory = "subdomains";
        let chartInstance = null;
        let currentParsedData = null;

        // Регулярное выражение для поиска доменов в названиях вкладок
        const DOMAIN_REGEX = /\.[a-zа-я0-9-]{2,}$/i;

        function extractSpreadsheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // Автоматическое обнаружение листов-доменов через каскадный прокси
        async function discoverSheets(sheetId) {
            const targetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`;

            // Список CORS-прокси на случай недоступности одного из них
            const proxies = [
                (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
                (u) => `https://corsproxy.io/?url=${encodeURIComponent(u)}`
            ];

            let html = "";
            for (const proxyFn of proxies) {
                try {
                    const res = await fetch(proxyFn(targetUrl));
                    if (!res.ok) continue;
                    const json = await res.json();
                    html = json.contents || json;
                    if (html && typeof html === "string" && html.length > 200) break;
                } catch (e) {
                    console.warn("Прокси недоступен, пробуем следующий...", e);
                }
            }

            if (!html) throw new Error("Не удалось прочесть оглавление листов через сеть");

            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            let names = [];
            doc.querySelectorAll(".sheet-tab, ul#sheet-menu li a, #sheet-menu li").forEach(el => {
                const txt = el.textContent.trim();
                if (txt) names.push(txt);
            });

            if (names.length === 0) {
                const matches = [...html.matchAll(/name:\s*"([^"]+)"/g)].map(m => m[1]);
                names = [...new Set(matches)];
            }

            const domainSheets = names.filter(name => DOMAIN_REGEX.test(name));
            return domainSheets.length > 0 ? domainSheets : names;
        }

        async function initDashboard() {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            const status = document.getElementById("statusText");
            const loadBtn = document.getElementById("loadBtn");

            const sheetId = extractSpreadsheetId(urlInput);
            if (!sheetId) {
                status.innerText = "Ошибка: не удалось распознать ID Google Таблицы в ссылке.";
                status.style.color = "var(--danger)";
                return;
            }

            currentSpreadsheetId = sheetId;
            status.innerText = "Сканирование структуры таблицы...";
            status.style.color = "var(--text-muted)";
            loadBtn.disabled = true;

            try {
                let sheets = await discoverSheets(sheetId);

                if (!sheets || sheets.length === 0) {
                    sheets = ["Лист1"];
                }

                status.innerText = `Найдено сайтов: ${sheets.length} (${sheets.join(", ")})`;
                status.style.color = "var(--success)";

                renderDomainTabs(sheets);
            } catch (err) {
                console.warn("Автодетект листов не удался, пробуем вкладку по умолчанию...", err);
                status.innerText = "Не удалось автоматически перечислить листы. Загружаем активный лист...";
                renderDomainTabs(["Лист1"]);
            } finally {
                loadBtn.disabled = false;
            }
        }

        function renderDomainTabs(sheets) {
            const container = document.getElementById("domainTabs");
            container.innerHTML = "";
            container.style.display = "flex";

            sheets.forEach((sheet, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = sheet;
                btn.onclick = () => {
                    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    loadSheet(sheet);
                };
                container.appendChild(btn);
            });

            document.getElementById("dashboardLayout").style.display = "grid";
            loadSheet(sheets[0]);
        }

        // Загрузка данных конкретного листа (нативный fetch без CORS проблем на GitHub Pages)
        async function loadSheet(sheetName) {
            activeSheetName = sheetName;
            document.getElementById("currentDomainLabel").innerText = sheetName;
            const status = document.getElementById("statusText");

            status.innerText = `Загрузка данных для ${sheetName}...`;
            status.style.color = "var(--text-muted)";

            try {
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${currentSpreadsheetId}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
                const res = await fetch(gvizUrl);
                const rawText = await res.text();

                // Очищаем JSON от обертки google.visualization.Query.setResponse(...)
                const jsonStart = rawText.indexOf("{");
                const jsonEnd = rawText.lastIndexOf("}");
                const json = JSON.parse(rawText.substring(jsonStart, jsonEnd + 1));

                if (!json || !json.table) throw new Error("Таблица пуста");

                processSheetData(json.table);
                status.innerText = `Сайт "${sheetName}" успешно загружен.`;
                status.style.color = "var(--success)";
                renderCurrentChart();
            } catch (e) {
                console.error(e);
                status.innerText = `Ошибка при получении данных с листа "${sheetName}". Убедитесь, что таблица доступна по ссылке.`;
                status.style.color = "var(--danger)";
            }
        }

        // Преобразование текстовых ячеек (проценты, секунды, прочерки) в чистые числа
        function cleanNumeric(val) {
            if (val === null || val === undefined) return 0;
            let s = String(val).trim();
            if (s === "" || s === "-" || s.toLowerCase().includes("нет")) return 0;

            s = s.replace("%", "").trim().replace(",", ".");

            // Формат "1:54"
            if (s.includes(":") && !s.includes(" ")) {
                const parts = s.split(":");
                return parts.length === 2 ? parseFloat(parts[0]) * 60 + parseFloat(parts[1]) : 0;
            }
            // Формат "1 м 28 c"
            if (s.includes("м") || s.includes("c")) {
                const minMatch = s.match(/(\d+)\s*м/);
                const secMatch = s.match(/(\d+)\s*c/);
                const min = minMatch ? parseInt(minMatch[1]) : 0;
                const sec = secMatch ? parseInt(secMatch[1]) : 0;
                return min * 60 + sec;
            }

            const num = parseFloat(s);
            return isNaN(num) ? 0 : num;
        }

        // Парсер структуры с объединенными ячейками (Forward-fill)
        function processSheetData(table) {
            const matrix = table.rows.map(r => (r.c || []).map(cell => cell ? (cell.f || cell.v || "") : ""));
            if (matrix.length < 4) return;

            // Строка 1: Главные разделы ("Количество лидов", "Топвизор"...)
            // Строка 3: Метрики ("Яндекс топ 3", "Показы", "Клики"...)
            const catRow = matrix[1] || [];
            const metricRow = matrix[3] || [];

            let activeCatKey = null;
            let columns = [];

            for (let c = 1; c < Math.max(catRow.length, metricRow.length); c++) {
                const top = String(catRow[c] || "").trim().toLowerCase();

                if (top.includes("лид")) activeCatKey = "leads";
                else if (top.includes("топвизор")) activeCatKey = "topvisor";
                else if (top.includes("метрика")) activeCatKey = "metrika";
                else if (top.includes("вебмастер")) activeCatKey = "webmaster";
                else if (top.includes("google search") || top.includes("gsc")) activeCatKey = "gsc";
                else if (top.includes("поддомены я")) activeCatKey = "subdomains_ya";
                else if (top.includes("поддомены г")) activeCatKey = "subdomains_google";

                const metricName = String(metricRow[c] || "").replace(/\n/g, " ").trim() || `Метрика ${c}`;

                if (activeCatKey) {
                    columns.push({ index: c, category: activeCatKey, metric: metricName });
                }
            }

            const dates = [];
            const store = {
                leads: {}, topvisor: {}, metrika: {}, webmaster: {},
                gsc: {}, subdomains_ya: {}, subdomains_google: {}
            };

            // Строка 4+: периоды и цифры
            for (let r = 4; r < matrix.length; r++) {
                const period = String(matrix[r][0] || "").trim();
                if (!period || !/\d{2}\.\d{2}/.test(period)) continue;
                dates.push(period);

                columns.forEach(col => {
                    if (!store[col.category][col.metric]) store[col.category][col.metric] = [];
                    store[col.category][col.metric].push(cleanNumeric(matrix[r][col.index]));
                });
            }

            currentParsedData = { dates, store };
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll(".menu-item").forEach(el => {
                el.classList.toggle("active", el.getAttribute("data-category") === cat);
            });
            renderCurrentChart();
        }

        // Отрисовка на графике
        function renderCurrentChart() {
            if (!currentParsedData) return;
            const ctx = document.getElementById("mainChart").getContext("2d");
            const { dates, store } = currentParsedData;
            let datasets = [];

            const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4", "#f97316"];

            // Режим наложения "Поддомены Я + Г"
            if (activeCategory === "subdomains") {
                document.getElementById("chartHeading").innerText = "Поддомены: Яндекс vs Google";

                // Яндекс (сплошная теплая линия)
                Object.keys(store["subdomains_ya"] || {}).forEach(m => {
                    datasets.push({
                        label: `Яндекс: ${m}`,
                        data: store["subdomains_ya"][m],
                        borderColor: "#f59e0b",
                        backgroundColor: "rgba(245, 158, 11, 0.1)",
                        borderWidth: 2.5,
                        tension: 0.25
                    });
                });

                // Google (синий пунктир для наглядности)
                Object.keys(store["subdomains_google"] || {}).forEach(m => {
                    datasets.push({
                        label: `Google: ${m}`,
                        data: store["subdomains_google"][m],
                        borderColor: "#3b82f6",
                        borderDash: [6, 4],
                        backgroundColor: "rgba(59, 130, 246, 0.1)",
                        borderWidth: 2.5,
                        tension: 0.25
                    });
                });

            } else {
                const target = store[activeCategory] || {};
                let cIdx = 0;

                Object.keys(target).forEach(m => {
                    const vals = target[m];
                    const hasData = vals.some(v => v > 0);
                    const col = colors[cIdx % colors.length];

                    datasets.push({
                        label: m,
                        data: vals,
                        borderColor: col,
                        backgroundColor: col + "20",
                        borderWidth: 2,
                        tension: 0.25,
                        hidden: !hasData
                    });
                    cIdx++;
                });

                const activeTitle = document.querySelector(`.menu-item[data-category="${activeCategory}"] span`);
                document.getElementById("chartHeading").innerText = activeTitle ? activeTitle.innerText : "График";
            }

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: dates, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { labels: { color: '#e7e9ea' } },
                        tooltip: {
                            backgroundColor: '#121214',
                            titleColor: '#e7e9ea',
                            bodyColor: '#71767b',
                            borderColor: '#2d2d30',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: '#2d2d30' },
                            ticks: { color: '#71767b', maxRotation: 45 }
                        },
                        y: {
                            grid: { color: '#2d2d30' },
                            ticks: { color: '#71767b' }
                        }
                    }
                }
            });
        }

        // Автостарт при открытии страницы
        window.addEventListener("DOMContentLoaded", () => {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            if (urlInput) initDashboard();
        });
    </script>
</body>

</html>
