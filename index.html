<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Leads Analytics Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #060607;
            --bg-card: #121214;
            --bg-input: #1a1a1c;
            --border-color: #2d2d30;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #ffffff;
            --accent-hover: #e2e2e2;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 24px;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .title {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--text-muted);
            background-color: #222224;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        /* Навигация по вкладкам (Сайты) */
        .tabs-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            overflow-x: auto;
        }

        .domain-tabs {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        .btn-add-tab {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* Сетка дашборда */
        .dashboard-layout {
            display: grid;
            grid-template-columns: 290px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .menu-item.active {
            background: #222226;
            border-color: var(--accent);
            color: var(--accent);
        }

        .menu-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 6px;
            background: var(--border-color);
            color: var(--text-main);
        }

        .chart-container {
            position: relative;
            height: 540px;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-main);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">
            <div>
                <h1>Отчетность проектов</h1>
                <div class="subtitle">Аналитика по лидам, позициям и индексации</div>
            </div>
        </div>

        <!-- Ввод ссылки -->
        <div class="card">
            <div class="input-row">
                <input type="text" id="sheetUrl" style="flex: 1; min-width: 300px;"
                    placeholder="Ссылка на Google Таблицу"
                    value="https://docs.google.com/spreadsheets/d/1QUidv9CoxZRpAwpM8AYEfD9ShWR1hEs9sjLmSQi7k_8/edit" />
                <button class="btn btn-primary" id="loadBtn" onclick="initDashboard()">Загрузить отчет</button>
            </div>
            <div id="statusText" class="status-msg">
                Введите ссылку и нажмите кнопку «Загрузить отчет».
            </div>
        </div>

        <!-- Вкладки сайтов -->
        <div class="tabs-wrapper" id="tabsWrapper" style="display: none;">
            <div class="domain-tabs" id="domainTabs"></div>
            <button class="btn btn-add-tab" onclick="promptAddDomain()">+ Добавить сайт</button>
        </div>

        <!-- Основная область -->
        <div class="dashboard-layout" id="dashboardLayout" style="display: none;">

            <!-- Сайдбар категорий -->
            <div class="card">
                <div class="card-title">Разделы отчета</div>
                <div class="sidebar-menu">
                    <div class="menu-item active" data-category="subdomains" onclick="selectCategory('subdomains')">
                        <span>Поддомены Я + Г</span>
                        <span class="menu-badge" id="badge-subdomains">0</span>
                    </div>
                    <div class="menu-item" data-category="leads" onclick="selectCategory('leads')">
                        <span>Количество лидов</span>
                        <span class="menu-badge" id="badge-leads">0</span>
                    </div>
                    <div class="menu-item" data-category="topvisor" onclick="selectCategory('topvisor')">
                        <span>Топвизор</span>
                        <span class="menu-badge" id="badge-topvisor">0</span>
                    </div>
                    <div class="menu-item" data-category="metrika" onclick="selectCategory('metrika')">
                        <span>Яндекс Метрика</span>
                        <span class="menu-badge" id="badge-metrika">0</span>
                    </div>
                    <div class="menu-item" data-category="webmaster" onclick="selectCategory('webmaster')">
                        <span>Яндекс Вебмастер</span>
                        <span class="menu-badge" id="badge-webmaster">0</span>
                    </div>
                    <div class="menu-item" data-category="gsc" onclick="selectCategory('gsc')">
                        <span>Google Search Console</span>
                        <span class="menu-badge" id="badge-gsc">0</span>
                    </div>
                </div>
            </div>

            <!-- Область графика -->
            <div class="card">
                <div class="card-title">
                    <span id="chartHeading">Поддомены: Яндекс vs Google</span>
                    <span class="subtitle" id="currentDomainLabel"></span>
                </div>
                <div class="chart-container">
                    <canvas id="mainChart"></canvas>
                </div>
            </div>

        </div>
    </div>

    <script>
        let currentSpreadsheetId = "";
        let activeCategory = "subdomains";
        let chartInstance = null;
        let currentParsedData = null;
        let knownSheets = [];

        const DOMAIN_REGEX = /\.[a-zа-я0-9-]{2,}$/i;

        function extractSpreadsheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // Быстрый поиск вкладок (таймаут 2.5 сек, чтобы ничего не зависало)
        async function discoverSheetsFast(sheetId) {
            const targetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;

            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), 2500);

            try {
                const res = await fetch(proxyUrl, { signal: controller.signal });
                clearTimeout(timer);
                if (!res.ok) return [];
                const json = await res.json();
                const html = json.contents;
                if (!html) return [];

                const doc = new DOMParser().parseFromString(html, "text/html");
                let names = [];
                doc.querySelectorAll(".sheet-tab, ul#sheet-menu li a, #sheet-menu li").forEach(el => {
                    const t = el.textContent.trim();
                    if (t) names.push(t);
                });

                const domainSheets = names.filter(n => DOMAIN_REGEX.test(n));
                return domainSheets.length ? domainSheets : names;
            } catch (e) {
                return [];
            }
        }

        async function initDashboard() {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            const status = document.getElementById("statusText");
            const loadBtn = document.getElementById("loadBtn");

            const sheetId = extractSpreadsheetId(urlInput);
            if (!sheetId) {
                status.innerText = "Ошибка: не удалось распознать ID Google Таблицы.";
                status.style.color = "var(--danger)";
                return;
            }

            currentSpreadsheetId = sheetId;
            status.innerText = "Чтение структуры таблицы...";
            status.style.color = "var(--text-muted)";
            loadBtn.disabled = true;

            // 1. Проверяем локальный кэш
            const saved = localStorage.getItem("sheets_" + sheetId);
            if (saved) {
                try { knownSheets = JSON.parse(saved); } catch (e) { knownSheets = []; }
            }

            // 2. Быстрый автодетект
            const detected = await discoverSheetsFast(sheetId);
            if (detected.length) {
                knownSheets = [...new Set([...knownSheets, ...detected])];
                localStorage.setItem("sheets_" + sheetId, JSON.stringify(knownSheets));
            }

            // 3. Если вкладок нет — открываем первый лист по умолчанию
            if (!knownSheets.length) {
                knownSheets = ["Основной лист"];
            }

            renderDomainTabs(knownSheets);
            loadBtn.disabled = false;
        }

        function renderDomainTabs(sheets) {
            const wrapper = document.getElementById("tabsWrapper");
            const container = document.getElementById("domainTabs");
            container.innerHTML = "";
            wrapper.style.display = "flex";

            sheets.forEach((sheet, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = sheet;
                btn.onclick = () => {
                    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    loadSheet(sheet);
                };
                container.appendChild(btn);
            });

            document.getElementById("dashboardLayout").style.display = "grid";
            loadSheet(sheets[0]);
        }

        function promptAddDomain() {
            const name = prompt("Введите точное имя листа Google Таблицы (например, site.ru):");
            if (!name || !name.trim()) return;
            const cleanName = name.trim();
            if (!knownSheets.includes(cleanName)) {
                // Убираем временный "Основной лист", если добавляем реальный домен
                knownSheets = knownSheets.filter(s => s !== "Основной лист");
                knownSheets.push(cleanName);
                localStorage.setItem("sheets_" + currentSpreadsheetId, JSON.stringify(knownSheets));
                renderDomainTabs(knownSheets);
            }
        }

        // Загрузка данных таблицы (нативный fetch с Google GViz API)
        async function loadSheet(sheetIdentifier) {
            document.getElementById("currentDomainLabel").innerText = sheetIdentifier;
            const status = document.getElementById("statusText");
            status.innerText = `Загрузка данных для "${sheetIdentifier}"...`;
            status.style.color = "var(--text-muted)";

            try {
                let gvizUrl = `https://docs.google.com/spreadsheets/d/${currentSpreadsheetId}/gviz/tq?tqx=out:json`;
                if (sheetIdentifier !== "Основной лист") {
                    gvizUrl += `&sheet=${encodeURIComponent(sheetIdentifier)}`;
                }

                const res = await fetch(gvizUrl);
                const raw = await res.text();

                const jsonStart = raw.indexOf("{");
                const jsonEnd = raw.lastIndexOf("}");
                const json = JSON.parse(raw.substring(jsonStart, jsonEnd + 1));

                if (!json || !json.table) throw new Error("Пустая таблица");

                processSheetData(json.table);
                updateCategoryBadges();
                renderCurrentChart();

                status.innerText = `Сайт "${sheetIdentifier}" успешно загружен (${currentParsedData.dates.length} периодов).`;
                status.style.color = "var(--success)";
            } catch (e) {
                console.error(e);
                status.innerText = `Ошибка при получении данных с листа "${sheetIdentifier}".`;
                status.style.color = "var(--danger)";
            }
        }

        // Очистка числовых значений (проценты, минуты, прочерки)
        function cleanNumeric(val) {
            if (val === null || val === undefined) return 0;
            if (typeof val === 'number') return isNaN(val) ? 0 : val;

            let s = String(val).trim();
            if (!s || s === "-" || s.toLowerCase().includes("нет")) return 0;

            s = s.replace("%", "").trim().replace(",", ".");

            // Формат "1:54"
            if (s.includes(":") && !s.includes(" ")) {
                const p = s.split(":");
                return p.length === 2 ? parseFloat(p[0]) * 60 + parseFloat(p[1]) : parseFloat(p[0]) || 0;
            }
            // Формат "1 м 28 c" или "33 c"
            if (s.includes("м") || s.includes("c")) {
                const m = s.match(/(\d+)\s*м/);
                const sec = s.match(/(\d+)\s*c/);
                return (m ? parseInt(m[1]) : 0) * 60 + (sec ? parseInt(sec[1]) : 0);
            }

            const num = parseFloat(s);
            return isNaN(num) ? 0 : num;
        }

        /**
         * НАДЕЖНЫЙ ДИНАМИЧЕСКИЙ ПАРСЕР ТАБЛИЦЫ
         */
        function processSheetData(table) {
            // 1. Преобразуем таблицу Google в плоскую матрицу ячеек
            const matrix = [];
            table.rows.forEach(r => {
                const row = [];
                (r.c || []).forEach(cell => {
                    let v = "";
                    if (cell) {
                        v = cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : "");
                    }
                    row.push(v);
                });
                matrix.push(row);
            });

            if (matrix.length < 2) return;

            // 2. Находим строку, в которой находятся категории (ищем по ключевым словам)
            let catRowIdx = -1;
            for (let r = 0; r < matrix.length; r++) {
                const rowText = matrix[r].map(c => String(c).toLowerCase()).join(" ");
                if (rowText.includes("топвизор") || rowText.includes("лидов") || rowText.includes("метрика") || rowText.includes("поддомен")) {
                    catRowIdx = r;
                    break;
                }
            }
            if (catRowIdx === -1) catRowIdx = 1;

            // 3. Находим первую строку с датами (формат 06.04.26)
            let dataStartRow = -1;
            for (let r = catRowIdx + 1; r < matrix.length; r++) {
                const val = String(matrix[r][0] || "").trim();
                if (/\d{1,2}[.\/]\d{1,2}/.test(val)) {
                    dataStartRow = r;
                    break;
                }
            }
            if (dataStartRow === -1) dataStartRow = catRowIdx + 2;

            // 4. Разбираем колонки и протягиваем категории (Forward-fill)
            const catRow = matrix[catRowIdx] || [];
            let maxCols = 0;
            matrix.forEach(row => { if (row.length > maxCols) maxCols = row.length; });

            let activeCatKey = null;
            const columns = [];

            for (let c = 1; c < maxCols; c++) {
                const rawCat = String(catRow[c] || "").trim().toLowerCase();

                // Проверяем смену категории
                if (rawCat.includes("лид")) activeCatKey = "leads";
                else if (rawCat.includes("топвизор")) activeCatKey = "topvisor";
                else if (rawCat.includes("метрика")) activeCatKey = "metrika";
                else if (rawCat.includes("вебмастер")) activeCatKey = "webmaster";
                else if (rawCat.includes("google search") || rawCat.includes("search console") || rawCat.includes("gsc")) activeCatKey = "gsc";
                else if (rawCat.includes("поддомены я") || rawCat.includes("поддомен я")) activeCatKey = "subdomains_ya";
                else if (rawCat.includes("поддомены г") || rawCat.includes("поддомен г") || rawCat.includes("поддомены g")) activeCatKey = "subdomains_google";
                else if (rawCat.includes("расход") || rawCat.includes("работ") || rawCat.includes("ссылк")) activeCatKey = null;

                if (!activeCatKey) continue;

                // Ищем название метрики в строках между категориями и датами
                let metricName = "";
                for (let r = dataStartRow - 1; r > catRowIdx; r--) {
                    const val = String(matrix[r][c] || "").replace(/\n/g, " ").trim();
                    if (val) {
                        metricName = val;
                        break;
                    }
                }

                // Если подстроки нет (как у Лидов и Поддоменов), задаем понятное имя
                if (!metricName) {
                    if (activeCatKey === "leads") metricName = "Количество лидов";
                    else if (activeCatKey === "subdomains_ya") metricName = "Поддомены Яндекс";
                    else if (activeCatKey === "subdomains_google") metricName = "Поддомены Google";
                    else metricName = `Метрика ${c}`;
                }

                columns.push({
                    index: c,
                    category: activeCatKey,
                    metric: metricName
                });
            }

            // 5. Заполняем ряды данных
            const dates = [];
            const store = {
                leads: {}, topvisor: {}, metrika: {}, webmaster: {},
                gsc: {}, subdomains_ya: {}, subdomains_google: {}
            };

            for (let r = dataStartRow; r < matrix.length; r++) {
                const period = String(matrix[r][0] || "").trim();
                if (!period || !/\d{1,2}[.\/]\d{1,2}/.test(period)) continue;
                dates.push(period);

                columns.forEach(col => {
                    if (!store[col.category][col.metric]) {
                        store[col.category][col.metric] = [];
                    }
                    const rawVal = matrix[r][col.index];
                    store[col.category][col.metric].push(cleanNumeric(rawVal));
                });
            }

            currentParsedData = { dates, store, columns };
        }
