<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEO & Leads Analytics Dashboard</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --bg-main: #060607;
            --bg-card: #121214;
            --bg-input: #1a1a1c;
            --border-color: #2d2d30;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #ffffff;
            --accent-hover: #e2e2e2;
            --danger: #f43f5e;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            padding: 32px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .title {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-row {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 300px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--text-muted);
        }

        .btn {
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--text-muted);
            background-color: #222224;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #000000;
            border: none;
            font-weight: 600;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .status-msg {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .domain-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .tab-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .tab-btn:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .tab-btn.active {
            background: var(--bg-input);
            color: var(--accent);
            border-color: var(--accent);
            font-weight: 600;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
            align-items: start;
        }

        @media (max-width: 960px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            position: sticky;
            top: 20px;
        }

        .menu-item {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-item:hover {
            color: var(--text-main);
            border-color: var(--text-muted);
        }

        .menu-item.active {
            background: #222226;
            border-color: var(--accent);
            color: var(--accent);
        }

        .charts-stack {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background-color: var(--bg-main);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background-color: var(--border-color);
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="title">
            <div>
                <h1>Отчетность проектов</h1>
                <div class="subtitle">Автоматическая визуализация данных Google Таблиц</div>
            </div>
        </div>

        <div class="card">
            <div class="input-row">
                <input type="text" id="sheetUrl"
                    placeholder="Вставьте ссылку на Google Таблицу (доступ: «Все, у кого есть ссылка»)"
                    value="https://docs.google.com/spreadsheets/d/1QUidv9CoxZRPAwpM8AYEfD9ShWR1hEs9sjLmSQi7k_8/edit" />
                <button class="btn btn-primary" id="loadBtn" onclick="initDashboard()">Загрузить отчет</button>
            </div>
            <div id="statusText" class="status-msg">
                Готов к работе. Вставьте ссылку и нажмите «Загрузить отчет».
            </div>
        </div>

        <!-- Вкладки сайтов сверху -->
        <div class="domain-tabs" id="domainTabs" style="display: none;"></div>

        <!-- Рабочая область -->
        <div class="dashboard-layout" id="dashboardLayout" style="display: none;">
            <div class="sidebar-menu">
                <div class="menu-item active" data-category="topvisor" onclick="selectCategory('topvisor')">
                    <span>Топвизор</span>
                </div>
                <div class="menu-item" data-category="leads" onclick="selectCategory('leads')">
                    <span>Количество лидов</span>
                </div>
                <div class="menu-item" data-category="metrika" onclick="selectCategory('metrika')">
                    <span>Яндекс Метрика</span>
                </div>
                <div class="menu-item" data-category="webmaster" onclick="selectCategory('webmaster')">
                    <span>Яндекс Вебмастер</span>
                </div>
                <div class="menu-item" data-category="gsc" onclick="selectCategory('gsc')">
                    <span>Google Search Console</span>
                </div>
                <div class="menu-item" data-category="subdomains" onclick="selectCategory('subdomains')">
                    <span>Поддомены Я + Г</span>
                </div>
                <div class="menu-item" data-category="costs" onclick="selectCategory('costs')">
                    <span>Работы и расходы</span>
                </div>
            </div>

            <div class="charts-stack" id="chartsStack"></div>
        </div>
    </div>

    <script>
        let currentSpreadsheetId = "";
        let activeSheetName = "";
        let activeCategory = "topvisor";
        let chartInstances = [];
        let currentParsedData = null;

        const DOMAIN_REGEX = /\.[a-zа-я0-9-]{2,}$/i;

        function extractSpreadsheetId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : (url.length > 25 && !url.includes("/") ? url.trim() : null);
        }

        // Автопоиск листов через надежные CORS-прокси
        async function discoverSheets(sheetId) {
            const targetUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`;

            const proxies = [
                (u) => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}`,
                (u) => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`
            ];

            let html = "";
            for (const proxyFn of proxies) {
                try {
                    const res = await fetch(proxyFn(targetUrl));
                    if (!res.ok) continue;
                    const text = await res.text();
                    try {
                        const j = JSON.parse(text);
                        html = j.contents || text;
                    } catch (_) {
                        html = text;
                    }
                    if (html && typeof html === "string" && html.length > 300) break;
                } catch (e) {
                    console.warn("Прокси недоступен, пробуем следующий...", e);
                }
            }

            if (!html) return [];

            const parser = new DOMParser();
            const doc = parser.parseFromString(html, "text/html");

            let names = [];
            doc.querySelectorAll(".sheet-tab, ul#sheet-menu li a, #sheet-menu li, .switcher-bar a").forEach(el => {
                const txt = el.textContent.trim();
                if (txt && !names.includes(txt)) names.push(txt);
            });

            if (names.length === 0) {
                const matches = [...html.matchAll(/name:\s*"([^"]+)"/g)].map(m => m[1]);
                names = [...new Set(matches)];
            }

            const domainSheets = names.filter(name => DOMAIN_REGEX.test(name));
            return domainSheets.length > 0 ? domainSheets : names;
        }

        async function initDashboard() {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            const status = document.getElementById("statusText");
            const loadBtn = document.getElementById("loadBtn");

            const sheetId = extractSpreadsheetId(urlInput);
            if (!sheetId) {
                status.innerText = "Ошибка: не удалось распознать ID Google Таблицы в ссылке.";
                status.style.color = "var(--danger)";
                return;
            }

            currentSpreadsheetId = sheetId;
            status.innerText = "Сканирование структуры таблицы...";
            status.style.color = "var(--text-muted)";
            loadBtn.disabled = true;

            try {
                let sheets = await discoverSheets(sheetId);

                if (sheets && sheets.length > 0) {
                    status.innerText = `Найдено сайтов: ${sheets.length} (${sheets.join(", ")})`;
                    status.style.color = "var(--success)";
                    renderDomainTabs(sheets);
                } else {
                    // Если прокси не ответили, загружаем первый лист напрямую через gid=0
                    status.innerText = "Вкладки не ответили через сеть. Загружаем активный лист...";
                    renderFallbackSingleTab();
                }
            } catch (err) {
                console.warn("Автодетект листов не удался...", err);
                renderFallbackSingleTab();
            } finally {
                loadBtn.disabled = false;
            }
        }

        function renderFallbackSingleTab() {
            const container = document.getElementById("domainTabs");
            container.innerHTML = "";
            container.style.display = "flex";

            const btn = document.createElement("button");
            btn.className = "tab-btn active";
            btn.innerText = "Основной лист";
            container.appendChild(btn);

            document.getElementById("dashboardLayout").style.display = "grid";
            loadSheetDirect(null);
        }

        function renderDomainTabs(sheets) {
            const container = document.getElementById("domainTabs");
            container.innerHTML = "";
            container.style.display = "flex";

            sheets.forEach((sheet, idx) => {
                const btn = document.createElement("button");
                btn.className = `tab-btn ${idx === 0 ? 'active' : ''}`;
                btn.innerText = sheet;
                btn.onclick = () => {
                    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    loadSheetDirect(sheet);
                };
                container.appendChild(btn);
            });

            document.getElementById("dashboardLayout").style.display = "grid";
            loadSheetDirect(sheets[0]);
        }

        // Загрузка данных конкретного листа
        async function loadSheetDirect(sheetName) {
            activeSheetName = sheetName || "Текущий лист";
            const status = document.getElementById("statusText");

            status.innerText = `Загрузка данных для "${activeSheetName}"...`;
            status.style.color = "var(--text-muted)";

            try {
                // Если имя листа известно, запрашиваем по имени, иначе по системному gid=0
                const sheetParam = sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : "&gid=0";
                const gvizUrl = `https://docs.google.com/spreadsheets/d/${currentSpreadsheetId}/gviz/tq?tqx=out:json${sheetParam}`;

                const res = await fetch(gvizUrl);
                if (!res.ok) {
                    throw new Error(`Google Таблица вернула ошибку HTTP ${res.status}. Убедитесь, что доступ открыт для всех по ссылке.`);
                }

                const rawText = await res.text();
                const jsonStart = rawText.indexOf("{");
                const jsonEnd = rawText.lastIndexOf("}");
                if (jsonStart === -1 || jsonEnd === -1) {
                    throw new Error("Неверный формат ответа от Google Таблицы.");
                }

                const json = JSON.parse(rawText.substring(jsonStart, jsonEnd + 1));
                if (!json || !json.table) throw new Error("Таблица не содержит данных.");

                processSheetData(json.table);
                status.innerText = `Лист "${activeSheetName}" успешно загружен. Периодов в отчете: ${currentParsedData.dates.length}`;
                status.style.color = "var(--success)";

                document.getElementById("dashboardLayout").style.display = "grid";
                renderCategoryCharts();
            } catch (e) {
                console.error(e);
                status.innerText = `Ошибка: ${e.message}`;
                status.style.color = "var(--danger)";
            }
        }

        function cleanNumeric(val) {
            if (val === null || val === undefined) return 0;
            let s = String(val).trim();
            if (s === "" || s === "-" || s.toLowerCase() === "нет" || s.toLowerCase().includes("нет данных") || s.toLowerCase().includes("проблем нет") || s.toLowerCase().includes("обнаружена проблема")) return 0;

            s = s.replace("%", "").trim().replace(",", ".");

            if (/^\d+:\d+(:\d+)?$/.test(s)) {
                const parts = s.split(":").map(Number);
                if (parts.length === 2) return parts[0] * 60 + parts[1];
                if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }

            if (/[мmсc]/i.test(s)) {
                const minMatch = s.match(/(\d+)\s*[мm]/i);
                const secMatch = s.match(/(\d+)\s*[сc]/i);
                const min = minMatch ? parseInt(minMatch[1], 10) : 0;
                const sec = secMatch ? parseInt(secMatch[1], 10) : 0;
                if (minMatch || secMatch) return min * 60 + sec;
            }

            const num = parseFloat(s.replace(/\s+/g, ""));
            return isNaN(num) ? 0 : num;
        }

        function formatSeconds(sec) {
            if (sec === null || sec === undefined || isNaN(sec)) return "-";
            const m = Math.floor(sec / 60);
            const s = Math.round(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        function processSheetData(table) {
            const colLabels = (table.cols || []).map(c => c ? (c.label || "") : "");
            const hasLabels = colLabels.some(l => l && l.trim().length > 0);

            const rowData = (table.rows || []).map(r => (r.c || []).map(cell => {
                if (!cell) return "";
                return cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== undefined && cell.v !== null ? cell.v : "");
            }));

            const matrix = hasLabels ? [colLabels, ...rowData] : rowData;
            parseMatrixData(matrix);
        }

        function parseMatrixData(matrix) {
            if (!matrix || matrix.length < 2) throw new Error("Недостаточно строк в таблице");

            let dataStartRow = -1;
            for (let r = 0; r < matrix.length; r++) {
                const val = String(matrix[r][0] || "").trim();
                if (/\d{2}[./]\d{2}/.test(val)) {
                    dataStartRow = r;
                    break;
                }
            }

            if (dataStartRow === -1) {
                throw new Error("Не найдена строка начала данных (периоды формата ДД.ММ)");
            }

            let maxCols = 0;
            matrix.forEach(r => { if (r.length > maxCols) maxCols = r.length; });

            const store = {
                topvisor: {}, metrika: {}, webmaster: {},
                gsc: {}, leads: {}, subdomains_ya: {}, subdomains_google: {}, costs: {}
            };

            const columnDefs = [];

            for (let c = 1; c < maxCols; c++) {
                const headerParts = [];
                for (let r = 0; r < dataStartRow; r++) {
                    const cellVal = String((matrix[r] && matrix[r][c]) || "").trim();
                    if (cellVal) headerParts.push(cellVal);
                }
                const h = headerParts.join(" ").toLowerCase();

                let category = null;
                let metricKey = null;

                // Топвизор
                if ((h.includes("топ 3") || h.includes("топ3")) && (h.includes("яндекс") || h.includes("я "))) {
                    category = "topvisor"; metricKey = "ya_top3";
                } else if ((h.includes("топ 10") || h.includes("топ10")) && (h.includes("яндекс") || h.includes("я "))) {
                    category = "topvisor"; metricKey = "ya_top10";
                } else if ((h.includes("топ 3") || h.includes("топ3")) && (h.includes("google") || h.includes("гугл") || h.includes("г "))) {
                    category = "topvisor"; metricKey = "g_top3";
                } else if ((h.includes("топ 10") || h.includes("топ10")) && (h.includes("google") || h.includes("гугл") || h.includes("г "))) {
                    category = "topvisor"; metricKey = "g_top10";
                }
                // Метрика: Трафик
                else if (h.includes("визит") && (h.includes("яндекс") || h.includes("я "))) {
                    category = "metrika"; metricKey = "ya_visits";
                } else if (h.includes("посетит") && (h.includes("яндекс") || h.includes("я "))) {
                    category = "metrika"; metricKey = "ya_visitors";
                } else if (h.includes("визит") && (h.includes("google") || h.includes("гугл") || h.includes("г "))) {
                    category = "metrika"; metricKey = "g_visits";
                } else if (h.includes("посетит") && (h.includes("google") || h.includes("гугл") || h.includes("г "))) {
                    category = "metrika"; metricKey = "g_visitors";
                }
                // Метрика: Поведение
                else if (h.includes("отказ")) {
                    category = "metrika"; metricKey = "bounce_rate";
                } else if (h.includes("глубин")) {
                    category = "metrika"; metricKey = "depth";
                } else if (h.includes("время на сайте") || h.includes("время")) {
                    category = "metrika"; metricKey = "time_on_site";
                }
                // Вебмастер: Страницы
                else if (h.includes("всего") && h.includes("страниц")) {
                    category = "webmaster"; metricKey = "total_pages";
                } else if (h.includes("поиск") && h.includes("страниц")) {
                    category = "webmaster"; metricKey = "pages_in_search";
                } else if (h.includes("исключ")) {
                    category = "webmaster"; metricKey = "excluded_pages";
                }
                // Вебмастер: AI и ассистенты
                else if (h.includes("видимост") || h.includes("ai")) {
                    category = "webmaster"; metricKey = "ai_visibility";
                } else if (h.includes("алис")) {
                    category = "webmaster"; metricKey = "alice_visits";
                } else if (h.includes("gpt")) {
                    category = "webmaster"; metricKey = "gpt_visits";
                }
                // Google Search Console
                else if (h.includes("клик")) {
                    category = "gsc"; metricKey = "gsc_clicks";
                } else if (h.includes("показ")) {
                    category = "gsc"; metricKey = "gsc_impressions";
                } else if (h.includes("не в индекс") || h.includes("не проиндекс")) {
                    category = "gsc"; metricKey = "gsc_not_indexed";
                } else if ((h.includes("в индекс") || h.includes("проиндекс")) && !h.includes("не")) {
                    category = "gsc"; metricKey = "gsc_indexed";
                } else if (h.includes("ссыл")) {
                    category = "gsc"; metricKey = "gsc_links";
                }
                // Лиды
                else if (h.includes("лид")) {
                    category = "leads"; metricKey = "leads_count";
                }
                // Поддомены
                else if (h.includes("поддомен") && (h.includes("я") || h.includes("яндекс"))) {
                    category = "subdomains_ya"; metricKey = "sub_ya";
                } else if (h.includes("поддомен") && (h.includes("г") || h.includes("google") || h.includes("гугл"))) {
                    category = "subdomains_google"; metricKey = "sub_g";
                }
                // Расходы
                else if (h.includes("заказано") || h.includes("текст") || h.includes("сумм") || h.includes("бирж")) {
                    category = "costs"; metricKey = headerParts[headerParts.length - 1] || `Колонка ${c}`;
                }

                if (category && metricKey) {
                    columnDefs.push({ colIndex: c, category, metricKey });
                    store[category][metricKey] = [];
                }
            }

            const dates = [];

            for (let r = dataStartRow; r < matrix.length; r++) {
                const period = String(matrix[r][0] || "").trim();
                if (!period || !/\d{2}[./]\d{2}/.test(period)) continue;
                dates.push(period);

                columnDefs.forEach(def => {
                    const rawVal = matrix[r][def.colIndex];
                    store[def.category][def.metricKey].push(cleanNumeric(rawVal));
                });
            }

            currentParsedData = { dates, store };
        }

        function selectCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll(".menu-item").forEach(el => {
                el.classList.toggle("active", el.getAttribute("data-category") === cat);
            });
            renderCategoryCharts();
        }

        function clearCharts() {
            chartInstances.forEach(c => c.destroy());
            chartInstances = [];
            document.getElementById("chartsStack").innerHTML = "";
        }

        function createChartCard(title, subtitle = "") {
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div class="card-title">
                    <span>${title}</span>
                    <span class="subtitle">${subtitle || activeSheetName}</span>
                </div>
                <div class="chart-container">
                    <canvas></canvas>
                </div>
            `;
            document.getElementById("chartsStack").appendChild(card);
            return card.querySelector("canvas").getContext("2d");
        }

        const baseChartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: {
                    labels: { color: '#e7e9ea', boxWidth: 14, font: { size: 12 } }
                },
                tooltip: {
                    backgroundColor: '#121214',
                    titleColor: '#e7e9ea',
                    bodyColor: '#71767b',
                    borderColor: '#2d2d30',
                    borderWidth: 1
                }
            },
            scales: {
                x: {
                    grid: { color: '#2d2d30' },
                    ticks: { color: '#71767b', maxRotation: 45 }
                },
                y: {
                    beginAtZero: true,
                    grid: { color: '#2d2d30' },
                    ticks: { color: '#71767b' }
                }
            }
        };

        function renderCategoryCharts() {
            if (!currentParsedData) return;
            clearCharts();
            const { dates, store } = currentParsedData;

            // 1. ТОПВИЗОР (1 график, 4 линии)
            if (activeCategory === "topvisor") {
                const ctx = createChartCard("Топвизор: Позиции Яндекс vs Google (Топ 3 и Топ 10)");
                const t = store.topvisor || {};

                const datasets = [
                    {
                        label: "Яндекс топ 3",
                        data: t.ya_top3 || [],
                        borderColor: "#ff7a00", // яркий оранжевый сплошной
                        backgroundColor: "rgba(255, 122, 0, 0.15)",
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.25
                    },
                    {
                        label: "Яндекс топ 10",
                        data: t.ya_top10 || [],
                        borderColor: "#fbbf24", // янтарный пунктир
                        borderDash: [6, 4],
                        borderWidth: 2.5,
                        pointRadius: 3,
                        tension: 0.25
                    },
                    {
                        label: "Google топ 3",
                        data: t.g_top3 || [],
                        borderColor: "#2563eb", // насыщенный синий сплошной
                        backgroundColor: "rgba(37, 99, 235, 0.15)",
                        borderWidth: 3,
                        pointRadius: 4,
                        tension: 0.25
                    },
                    {
                        label: "Google топ 10",
                        data: t.g_top10 || [],
                        borderColor: "#60a5fa", // светло-голубой пунктир
                        borderDash: [6, 4],
                        borderWidth: 2.5,
                        pointRadius: 3,
                        tension: 0.25
                    }
                ];

                chartInstances.push(new Chart(ctx, {
                    type: 'line',
                    data: { labels: dates, datasets },
                    options: baseChartOptions
                }));
            }

            // 2. ЯНДЕКС МЕТРИКА (2 графика)
            else if (activeCategory === "metrika") {
                const m = store.metrika || {};

                // График 1: Трафик
                const ctxTraffic = createChartCard("Яндекс Метрика: Трафик (Визиты и Посетители)");
                chartInstances.push(new Chart(ctxTraffic, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Яндекс визиты",
                                data: m.ya_visits || [],
                                borderColor: "#ff7a00",
                                borderWidth: 3,
                                pointRadius: 4,
                                tension: 0.25
                            },
                            {
                                label: "Яндекс посетители",
                                data: m.ya_visitors || [],
                                borderColor: "#fbbf24",
                                borderDash: [6, 4],
                                borderWidth: 2.5,
                                pointRadius: 3,
                                tension: 0.25
                            },
                            {
                                label: "Google визиты",
                                data: m.g_visits || [],
                                borderColor: "#2563eb",
                                borderWidth: 3,
                                pointRadius: 4,
                                tension: 0.25
                            },
                            {
                                label: "Google посетители",
                                data: m.g_visitors || [],
                                borderColor: "#60a5fa",
                                borderDash: [6, 4],
                                borderWidth: 2.5,
                                pointRadius: 3,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));

                // График 2: Поведение
                const ctxBehavior = createChartCard("Яндекс Метрика: Отказы, Глубина и Время на сайте");
                chartInstances.push(new Chart(ctxBehavior, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Процент отказов (%)",
                                data: m.bounce_rate || [],
                                borderColor: "#ec4899",
                                backgroundColor: "rgba(236, 72, 153, 0.1)",
                                borderWidth: 2.5,
                                yAxisID: 'y',
                                tension: 0.25
                            },
                            {
                                label: "Глубина (стр)",
                                data: m.depth || [],
                                borderColor: "#10b981",
                                borderWidth: 2.5,
                                yAxisID: 'y',
                                tension: 0.25
                            },
                            {
                                label: "Время на сайте",
                                data: m.time_on_site || [],
                                borderColor: "#a855f7",
                                borderWidth: 2.5,
                                yAxisID: 'yTime',
                                tension: 0.25
                            }
                        ]
                    },
                    options: {
                        ...baseChartOptions,
                        plugins: {
                            ...baseChartOptions.plugins,
                            tooltip: {
                                ...baseChartOptions.plugins.tooltip,
                                callbacks: {
                                    label: function (context) {
                                        if (context.dataset.label === "Время на сайте") {
                                            return `Время на сайте: ${formatSeconds(context.parsed.y)}`;
                                        }
                                        if (context.dataset.label.includes("отказов")) {
                                            return `${context.dataset.label}: ${context.parsed.y}%`;
                                        }
                                        return `${context.dataset.label}: ${context.parsed.y}`;
                                    }
                                }
                            }
                        },
                        scales: {
                            x: baseChartOptions.scales.x,
                            y: {
                                beginAtZero: true,
                                position: 'left',
                                grid: { color: '#2b3044' },
                                ticks: { color: '#71767b' },
                                title: { display: true, text: 'Отказы (%) / Глубина', color: '#71767b' }
                            },
                            yTime: {
                                beginAtZero: true,
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                ticks: {
                                    color: '#a855f7',
                                    callback: (val) => formatSeconds(val)
                                },
                                title: { display: true, text: 'Время (мм:сс)', color: '#a855f7' }
                            }
                        }
                    }
                }));
            }

            // 3. ЯНДЕКС ВЕБМАСТЕР (2 графика)
            else if (activeCategory === "webmaster") {
                const w = store.webmaster || {};

                // График 1: Страницы
                const ctxPages = createChartCard("Яндекс Вебмастер: Страницы и индексация");
                chartInstances.push(new Chart(ctxPages, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Всего страниц",
                                data: w.total_pages || [],
                                borderColor: "#3b82f6",
                                borderWidth: 3,
                                tension: 0.25
                            },
                            {
                                label: "Страниц в поиске",
                                data: w.pages_in_search || [],
                                borderColor: "#10b981",
                                borderWidth: 2.5,
                                tension: 0.25
                            },
                            {
                                label: "Исключённых страниц",
                                data: w.excluded_pages || [],
                                borderColor: "#ef4444",
                                borderWidth: 2.5,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));

                // График 2: AI и ассистенты
                const ctxAi = createChartCard("Яндекс Вебмастер: Видимость в AI и переходы с ассистентов");
                chartInstances.push(new Chart(ctxAi, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Переходы из Алисы",
                                data: w.alice_visits || [],
                                borderColor: "#f59e0b",
                                borderWidth: 2.5,
                                yAxisID: 'y',
                                tension: 0.25
                            },
                            {
                                label: "Переходы из GPT",
                                data: w.gpt_visits || [],
                                borderColor: "#06b6d4",
                                borderWidth: 2.5,
                                yAxisID: 'y',
                                tension: 0.25
                            },
                            {
                                label: "Видимость в AI (%)",
                                data: w.ai_visibility || [],
                                borderColor: "#8b5cf6",
                                backgroundColor: "rgba(139, 92, 246, 0.15)",
                                borderWidth: 3,
                                spanGaps: true,
                                yAxisID: 'yAi',
                                tension: 0.25
                            }
                        ]
                    },
                    options: {
                        ...baseChartOptions,
                        scales: {
                            x: baseChartOptions.scales.x,
                            y: {
                                beginAtZero: true,
                                position: 'left',
                                grid: { color: '#2b3044' },
                                ticks: { color: '#71767b' },
                                title: { display: true, text: 'Переходы (кол-во)', color: '#71767b' }
                            },
                            yAi: {
                                beginAtZero: true,
                                position: 'right',
                                max: 100,
                                grid: { drawOnChartArea: false },
                                ticks: {
                                    color: '#71767b',
                                    callback: (v) => v + '%'
                                },
                                title: { display: true, text: 'Видимость (%)', color: '#71767b' }
                            }
                        }
                    }
                }));
            }

            // 4. GOOGLE SEARCH CONSOLE (3 графика)
            else if (activeCategory === "gsc") {
                const g = store.gsc || {};

                // График 1: Клики и Показы
                const ctxClicks = createChartCard("Google Search Console: Клики и Показы");
                chartInstances.push(new Chart(ctxClicks, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Клики",
                                data: g.gsc_clicks || [],
                                borderColor: "#3b82f6",
                                backgroundColor: "rgba(59, 130, 246, 0.15)",
                                borderWidth: 3,
                                yAxisID: 'y',
                                tension: 0.25
                            },
                            {
                                label: "Показы",
                                data: g.gsc_impressions || [],
                                borderColor: "#a855f7",
                                borderWidth: 2.5,
                                yAxisID: 'yImpressions',
                                tension: 0.25
                            }
                        ]
                    },
                    options: {
                        ...baseChartOptions,
                        scales: {
                            x: baseChartOptions.scales.x,
                            y: {
                                beginAtZero: true,
                                position: 'left',
                                grid: { color: '#2b3044' },
                                ticks: { color: '#3b82f6' },
                                title: { display: true, text: 'Клики', color: '#3b82f6' }
                            },
                            yImpressions: {
                                beginAtZero: true,
                                position: 'right',
                                grid: { drawOnChartArea: false },
                                ticks: { color: '#a855f7' },
                                title: { display: true, text: 'Показы', color: '#a855f7' }
                            }
                        }
                    }
                }));

                // График 2: Индексация
                const ctxIndex = createChartCard("Google Search Console: Индексация страниц");
                chartInstances.push(new Chart(ctxIndex, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Стр в индексе",
                                data: g.gsc_indexed || [],
                                borderColor: "#10b981",
                                borderWidth: 3,
                                tension: 0.25
                            },
                            {
                                label: "Стр не в индексе",
                                data: g.gsc_not_indexed || [],
                                borderColor: "#f59e0b",
                                borderWidth: 2.5,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));

                // График 3: Ссылки
                const ctxLinks = createChartCard("Google Search Console: Внешние ссылки");
                chartInstances.push(new Chart(ctxLinks, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Внешних ссылок",
                                data: g.gsc_links || [],
                                borderColor: "#06b6d4",
                                backgroundColor: "rgba(6, 182, 212, 0.15)",
                                borderWidth: 3,
                                fill: true,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));
            }

            // 5. КОЛИЧЕСТВО ЛИДОВ (1 график)
            else if (activeCategory === "leads") {
                const ctxLeads = createChartCard("Количество лидов (общий итог)");
                const l = store.leads || {};
                chartInstances.push(new Chart(ctxLeads, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Количество лидов",
                                data: l.leads_count || [],
                                borderColor: "#10b981",
                                backgroundColor: "rgba(16, 185, 129, 0.15)",
                                borderWidth: 3,
                                pointRadius: 5,
                                fill: true,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));
            }

            // 6. ПОДДОМЕНЫ Я + Г (1 график)
            else if (activeCategory === "subdomains") {
                const ctxSub = createChartCard("Поддомены: Яндекс vs Google (данные с августа)");
                const ya = store.subdomains_ya || {};
                const g = store.subdomains_google || {};

                chartInstances.push(new Chart(ctxSub, {
                    type: 'line',
                    data: {
                        labels: dates,
                        datasets: [
                            {
                                label: "Яндекс (поддомены)",
                                data: ya.sub_ya || [],
                                borderColor: "#ff7a00",
                                backgroundColor: "rgba(255, 122, 0, 0.15)",
                                borderWidth: 3,
                                pointRadius: 4,
                                tension: 0.25
                            },
                            {
                                label: "Google (поддомены)",
                                data: g.sub_g || [],
                                borderColor: "#2563eb",
                                borderDash: [6, 4],
                                backgroundColor: "rgba(37, 99, 235, 0.15)",
                                borderWidth: 2.5,
                                pointRadius: 4,
                                tension: 0.25
                            }
                        ]
                    },
                    options: baseChartOptions
                }));
            }

            // 7. РАБОТЫ И РАСХОДЫ
            else if (activeCategory === "costs") {
                const ctxCosts = createChartCard("Работы и расходы");
                const target = store.costs || {};
                const colors = ["#3b82f6", "#10b981", "#f59e0b", "#ec4899", "#8b5cf6", "#06b6d4"];
                let cIdx = 0;
                let datasets = [];

                Object.keys(target).forEach(m => {
                    const vals = target[m];
                    const hasData = vals.some(v => v !== null && v > 0);
                    const col = colors[cIdx % colors.length];
                    datasets.push({
                        label: m,
                        data: vals,
                        borderColor: col,
                        backgroundColor: col + "20",
                        borderWidth: 2,
                        pointRadius: 3,
                        tension: 0.2,
                        hidden: !hasData
                    });
                    cIdx++;
                });

                chartInstances.push(new Chart(ctxCosts, {
                    type: 'line',
                    data: { labels: dates, datasets },
                    options: baseChartOptions
                }));
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const urlInput = document.getElementById("sheetUrl").value.trim();
            if (urlInput) initDashboard();
        });
    </script>
</body>

</html>
